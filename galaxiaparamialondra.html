<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Para Alondra 🌻</title>
<style>
  :root{
    --bg:#0b0b0f;
    --glass: rgba(255,255,255,0.06);
  }
  html,body{height:100%;margin:0;background:var(--bg);font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;}
  .stage{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* contenedor de la foto (se irá revelando con clip-path) */
  .photo-wrap{
    position: absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
  }
  .photo{
    width:92%;
    max-width:820px;
    height:auto;
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
    transform: translateY(0);
    transition: transform .6s ease;
    /* empieza completamente oculto con clip-path */
    clip-path: circle(0% at 50% 50%);
  }

  /* overlay suave para que el texto contraste */
  .overlay {
    position:absolute;
    inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.5));
    mix-blend-mode:multiply;
    pointer-events:none;
  }

  /* capa donde aparecen las palabras */
  .words-layer{
    position:relative;
    z-index:5;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
  }

  /* estilo base para cada palabra flotante */
  .word {
    position:absolute;
    font-weight:700;
    font-size:clamp(18px,4vw,36px);
    white-space:nowrap;
    padding:6px 10px;
    border-radius:999px;
    text-shadow:
      0 1px 0 rgba(255,255,255,0.06),
      0 8px 24px rgba(0,0,0,0.45);
    -webkit-text-stroke: 0.6px rgba(0,0,0,0.15);
    transform: translate(-50%,0) scale(1);
    opacity:0;
    will-change: transform, opacity, filter;
    filter: drop-shadow(0 6px 18px rgba(0,0,0,0.45));
    animation: floatUp 3.6s ease-out forwards;
    cursor:default;
  }

  /* efecto brillante usando gradiente y background-clip */
  .word .gloss {
    background: linear-gradient(90deg,
      rgba(255,140,180,1),
      rgba(255,210,90,1),
      rgba(100,220,255,1),
      rgba(160,120,255,1)
    );
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    display:inline-block;
    padding:0 6px;
  }

  /* animación de ascenso y desvanecimiento */
  @keyframes floatUp {
    0% { transform: translate(-50%, 20px) scale(0.96); opacity:0; filter: blur(2px) saturate(1.1);}
    10% { opacity:1; transform: translate(-50%, 0) scale(1.02); filter: blur(0) saturate(1.25);}
    65% { opacity:1; transform: translate(-50%, -90px) scale(1); }
    100% { opacity:0; transform: translate(-50%, -160px) scale(0.96); filter: blur(2px) saturate(1);}
  }

  /* barra inferior con controles */
  .controls {
    position: absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:12;
    display:flex;
    gap:10px;
    align-items:center;
    backdrop-filter: blur(6px);
    background: linear-gradient(90deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
    padding:8px;
    border-radius:999px;
  }
  .btn{
    background:transparent;
    border:1px solid rgba(255,255,255,0.08);
    padding:8px 14px;
    color:#fff;
    font-weight:600;
    border-radius:999px;
    cursor:pointer;
  }
  .btn:active{transform:translateY(1px);}

  /* texto central grande con nombre */
  .center-name{
    position: absolute;
    z-index:6;
    text-align:center;
    color:#fff;
    pointer-events:none;
  }
  .center-name h1{
    margin:0;
    font-size:clamp(28px,6.6vw,64px);
    letter-spacing:1px;
    font-weight:800;
    line-height:0.9;
    transform:translateY(0);
    text-shadow:0 6px 30px rgba(0,0,0,0.6);
  }
  .center-name .sub{
    margin-top:8px;
    font-size:clamp(12px,2.6vw,18px);
    opacity:0.9;
  }

  /* detalles responsivos */
  @media (max-width:520px){
    .word{font-size:clamp(14px,3.5vw,22px)}
    .controls{bottom:10px}
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="photo-wrap">
      <!-- Reemplaza "photo.jpg" por el nombre de tu archivo o la URL (por ejemplo: "miFoto.jpg") -->
      <img id="photo" class="photo" src="photo.jpg" alt="Foto para Alondra">
    </div>

    <div class="overlay"></div>

    <div class="words-layer" id="wordsLayer"></div>

    <div class="center-name" aria-hidden="true">
      <h1 id="nameDisplay"><span class="gloss">Alondra</span></h1>
      <div class="sub">mi todo • mi sol • mi risa ✨</div>
    </div>

    <div class="controls">
      <button class="btn" id="spawnBtn">Enviar cariño 💌</button>
      <button class="btn" id="revealBtn">Revelar foto ✨</button>
      <button class="btn" id="shareBtn">Compartir</button>
    </div>
  </div>

<script>
/* ---------------------------
   CONFIGURACIÓN PRÁCTICA
   --------------------------- */
const words = [
  "Eres mi sol ☀️",
  "Te adoro ❤️",
  "Mi Alondra 💐",
  "Eres hermosa ✨",
  "Mi razón de sonreír 😊",
  "Siempre contigo 💞",
  "Tu risa, mi canción 🎶",
  "Mi todo 🥰",
  "Te pienso todo el día 🌼",
  "Eres única 💫",
];

const wordsLayer = document.getElementById('wordsLayer');
const photo = document.getElementById('photo');
let revealProgress = 0; // 0..1

/* Genera una palabra flotante en una posición aleatoria */
function spawnWord(text){
  const el = document.createElement('div');
  el.className = 'word';
  // colocamos en x aleatorio (20%..80% ancho), y cerca del centro-bottom
  const x = 10 + Math.random()*80;
  el.style.left = x + '%';
  // tamaño aleatorio
  const size = 0.9 + Math.random()*1.2;
  el.style.fontSize = (16 * size) + 'px';

  // texto con estilo gloss
  el.innerHTML = `<span class="gloss">${text}</span>`;

  // duración aleatoria: variamos la animación con inline style
  const animDur = 3.2 + Math.random()*1.4;
  el.style.animationDuration = animDur + 's';

  wordsLayer.appendChild(el);

  // eliminar del DOM cuando termine la animación
  setTimeout(()=> {
    if (el && el.parentNode) el.parentNode.removeChild(el);
  }, (animDur+0.2)*1000);
}

/* Lanza varias palabras en ráfaga */
function burst(count=4){
  for(let i=0;i<count;i++){
    const w = words[Math.floor(Math.random()*words.length)];
    // ligeras pausas entre cada palabra
    setTimeout(()=> spawnWord(w), i*160 + Math.random()*220);
  }
  // mientras salen palabras, avanzamos un poco la revelación
  stepReveal(0.12 * (count/4));
}

/* Revela la foto incrementando el clip-path (círculo) */
function stepReveal(delta){
  revealProgress = Math.min(1, revealProgress + delta);
  // convertimos revealProgress a percent para clip-path radius
  // al 0% = oculto, 100% = totalmente visible (circle(150%))
  const pct = 0 + revealProgress*150;
  photo.style.clipPath = `circle(${pct}% at 50% 50%)`;
}

/* Botones y eventos */
document.getElementById('spawnBtn').addEventListener('click', ()=> {
  burst(5);
});

document.getElementById('revealBtn').addEventListener('click', ()=> {
  // Revelación suave: incrementos periódicos hasta 1
  const interval = setInterval(()=> {
    stepReveal(0.08);
    if (revealProgress >= 1) clearInterval(interval);
  }, 180);
});

document.getElementById('shareBtn').addEventListener('click', async ()=> {
  const title = "Para Alondra 🌻";
  const text = "Un mensajito bonito para Alondra ✨";
  try {
    // si el navegador soporta share (móvil), lo usamos
    if (navigator.share){
      await navigator.share({title, text, url: location.href});
      return;
    }
    // Si no, copiamos la URL al portapapeles
    await navigator.clipboard.writeText(location.href);
    alert('Enlace copiado al portapapeles. Pégalo donde quieras compartirlo 💌');
  } catch(e){
    alert('No fue posible compartir directamente. Copia la URL desde la barra de direcciones.');
  }
});

/* Auto-burst inicial y loop suave */
setTimeout(()=> burst(6), 700);
setInterval(()=> {
  // cada 3s lanza 1-3 palabras
  burst(1 + Math.floor(Math.random()*3));
}, 3000);

/* Si quieres que la foto empiece ya visible al cargar, descomenta:
stepReveal(1);
*/

/* CONSEJO: para usar la foto que subiste, reemplaza "photo.jpg" por el nombre del archivo,
   o arrastra/selecciona la imagen dentro de Code Editor y ajusta el src. */
</script>
</body>
</html>
